openapi: 3.0.3
info:
  title: Todo List REST API
  description: |
    REST API for Todo List application supporting Create, Read, Update, Delete operations.
    Used when BACKEND_MODE=rest (manual refresh required for multi-instance sync).
  version: 1.0.0
  contact:
    name: eng-soft-2025-2 Team
servers:
  - url: http://localhost:3000/api
    description: Local development server

tags:
  - name: Tasks
    description: Task management operations

paths:
  /tasks:
    get:
      summary: List all tasks
      description: |
        Retrieve all tasks ordered by newest first (reverse chronological by createdAt).
        Used by FR-001 (view tasks on app load) and manual refresh in REST mode.
      tags:
        - Tasks
      responses:
        '200':
          description: Successfully retrieved tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
              example:
                tasks:
                  - id: "a3f2c8b1-4d5e-6f7g-8h9i-0j1k2l3m4n5o"
                    title: "Buy organic groceries"
                    createdAt: "2026-01-03T15:00:00.000Z"
                    updatedAt: "2026-01-03T15:00:00.000Z"
                  - id: "b4g3d9c2-5e6f-7g8h-9i0j-1k2l3m4n5o6p"
                    title: "Prepare presentation"
                    createdAt: "2026-01-03T14:30:00.000Z"
                    updatedAt: "2026-01-03T14:30:00.000Z"
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Create a new task
      description: |
        Create a new task with user-provided title. Backend generates ID and timestamps.
        Task appears at top of list (newest first). Used by FR-002 (create task).
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Task description (non-empty after trim)
            example:
              title: "Buy groceries"
      responses:
        '201':
          description: Task successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              example:
                id: "c5h4e0d3-6f7g-8h9i-0j1k-2l3m4n5o6p7q"
                title: "Buy groceries"
                createdAt: "2026-01-03T16:00:00.000Z"
                updatedAt: "2026-01-03T16:00:00.000Z"
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tasks/{id}:
    put:
      summary: Update an existing task
      description: |
        Update task title. Backend updates updatedAt timestamp. Task position
        in list remains unchanged (createdAt not modified). Used by FR-003 (edit task).
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the task to update
          schema:
            type: string
            format: uuid
            example: "a3f2c8b1-4d5e-6f7g-8h9i-0j1k2l3m4n5o"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 500
            example:
              title: "Buy organic groceries"
      responses:
        '200':
          description: Task successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              example:
                id: "a3f2c8b1-4d5e-6f7g-8h9i-0j1k2l3m4n5o"
                title: "Buy organic groceries"
                createdAt: "2026-01-03T15:00:00.000Z"
                updatedAt: "2026-01-03T16:15:00.000Z"
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Delete a task
      description: |
        Permanently delete a task. No confirmation required (immediate delete per
        clarification). Used by FR-004 (delete task).
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the task to delete
          schema:
            type: string
            format: uuid
            example: "a3f2c8b1-4d5e-6f7g-8h9i-0j1k2l3m4n5o"
      responses:
        '204':
          description: Task successfully deleted (no content)
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    Task:
      type: object
      required:
        - id
        - title
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier (UUID v4)
          example: "a3f2c8b1-4d5e-6f7g-8h9i-0j1k2l3m4n5o"
        title:
          type: string
          minLength: 1
          maxLength: 500
          description: Task description
          example: "Buy groceries"
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (ISO 8601)
          example: "2026-01-03T15:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp (ISO 8601)
          example: "2026-01-03T15:00:00.000Z"

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Additional error context
          additionalProperties: true

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Validation failed"
            details:
              title: "Title cannot be empty"

    TaskNotFound:
      description: Task not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Task not found"
            details:
              id: "a3f2c8b1-4d5e-6f7g-8h9i-0j1k2l3m4n5o"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Internal server error"
            details:
              message: "Unexpected error occurred"

  securitySchemes: {}

security: []
